<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .w { stroke:#FFFFFF; }
      .c { stroke:#2BA9E0; }
      .r { fill:none; stroke-width:5.5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- ring: white for most of it, cyan across the top-right -->
  <!-- white arc: from 40deg clockwise round to -70deg -->
  <path class="r w" d="M 100.6 98.6 A 48 48 0 1 1 26.5 21.5" />
  <!-- cyan arc: the top-right sweep -->
  <path class="r c" d="M 26.5 21.5 A 48 48 0 0 1 100.6 98.6" />

  <!-- B -->
  <path class="r w" d="M 31 29 H 50 A 12 12 0 0 1 50 53 H 31 V 29 M 31 53 H 53 A 12 12 0 0 1 53 77 H 31 V 53" />

  <!-- K arms, in cyan -->
  <path class="r c" style="stroke-width:7" d="M 61 53 L 88 27" />
  <path class="r c" style="stroke-width:7" d="M 61 53 L 95 88" />
</svg>
